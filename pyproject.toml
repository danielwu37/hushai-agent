[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hushai-agent"
version = "0.1.0"
description = "以本地 Markdown 文件夹为唯一记忆的个人 AI 框架"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "hushAi-agent contributors"}
]
dependencies = []

[project.scripts]
hushai = "hushai_agent.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hushai_agent = ["templates/**/*", "templates/**/.*"]
